<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Scraper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <h1>Lead Scraper</h1>
    <p>Enter the app password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="loginError" class="error" hidden></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand">Lead Scraper</div>
    <nav>
      <a href="#/overview" data-nav="overview">Overview</a>
      <a href="#/new" data-nav="new">New scrape</a>
      <a href="#/runs" data-nav="runs">Runs <span id="runBadge" class="badge" hidden></span></a>
      <a href="#/leads" data-nav="leads">Leads</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="view" class="view"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
